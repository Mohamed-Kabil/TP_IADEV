name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install "numpy==1.26.4" "pandas==2.2.*" "scikit-learn==1.5.*" "joblib==1.4.*" "pytest==8.3.*" "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*"
      - name: Modèle de démonstration et API (TP1 du manuel V1.1)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - run: . .venv/bin/activate && pytest -q
