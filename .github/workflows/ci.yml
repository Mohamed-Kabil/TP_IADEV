name: CI
on: [push, pull_request]
jobs:
  tp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install "numpy==1.26.4" "pandas==2.2.*" "scikit-learn==1.5.*" "joblib==1.4.*" "pytest==8.3.*" "fastapi==0.115.*" "pydantic==2.9.*" "httpx==0.27.*" "uvicorn==0.30.*" "python-dotenv==1.0.*" "streamlit==1.39.*" "pyarrow==17.0.0" -r requirements-dev.txt
      - name: Modèle de démonstration et API (TP1 du manuel V1.1)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Ruff
        run: . .venv/bin/activate && ruff check .
      - name: Types de l'API
        run: . .venv/bin/activate && mypy api
      - name: Tests Python et couverture API
        run: . .venv/bin/activate && python -m pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
      - name: Client web
        run: node --test web/client.test.mjs
      - name: Construire les distributions TP4
        run: |
          . .venv/bin/activate
          pip install build
          mkdir -p src/sentiment_app/modele
          cp models/sentiment.joblib src/sentiment_app/modele/
          python -m build
      - name: Tester la roue hors des sources
        run: |
          python -m venv "$RUNNER_TEMP/paquet"
          "$RUNNER_TEMP/paquet/bin/python" -m pip install dist/*.whl "pytest>=8,<9"
          cp tests/test_paquet.py "$RUNNER_TEMP/test_paquet.py"
          cd "$RUNNER_TEMP"
          VERIFICATION_LIVRABLE=1 "$RUNNER_TEMP/paquet/bin/python" -I -m pytest test_paquet.py -q --import-mode=importlib
